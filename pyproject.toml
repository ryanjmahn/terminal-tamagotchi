[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-tamagotchi"
version = "0.1.0"
description = "An ASCII pet that lives in your terminal and feeds on your git commits."
requires-python = ">=3.8"

[project.scripts]
pet = "tamagotchi.cli:main"

[tool.setuptools]
packages = ["tamagotchi"]
